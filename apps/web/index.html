<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tracebase 企业知识库</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <!--
      Day 8 起，页面结构由 React 组件在运行时生成，这个文件只剩三件事：
      声明语言和字符集、加载样式表、给 React 一个挂载点。

      lang="zh-CN" 留在这里而不进组件：读屏软件靠它选中文语音，
      而它必须在 JS 执行之前就生效。同理 <link> 也留着——
      样式表要和 HTML 并行下载，等到 JS 跑起来再插入样式会先闪一屏无样式内容。

      代价是页面在 JS 加载失败时完全空白。原来的静态 HTML 至少能显示骨架。
      这是单页应用的真实取舍，不是疏漏；Day 11 迁到 Next.js 后由服务端渲染解决。
    -->
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
