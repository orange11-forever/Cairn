[project]
name = "cairn-worker"
version = "0.1.0"
license = "ISC"
description = "Cairn knowledge ingestion worker"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cairn-api",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]

[project.scripts]
cairn-worker = "cairn_worker.__main__:main"

[dependency-groups]
dev = [
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "reportlab>=4.2,<5",
  "ruff>=0.9,<1",
]

[tool.uv.sources]
cairn-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_worker"]
