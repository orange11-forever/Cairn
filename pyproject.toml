[project]
name = "cairn-workspace"
version = "0.1.0"
license = "ISC"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "integration: requires an isolated PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["apps/api/src", "apps/api/tests", "apps/worker/src", "apps/worker/tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
