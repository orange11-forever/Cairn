services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-trixie
    ports:
      - "${CAIRN_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cairn}"
      POSTGRES_USER: "${POSTGRES_USER:-cairn}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cairn-local-only}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - cairn_postgres_data:/var/lib/postgresql/data

  minio:
    build:
      context: ../..
      dockerfile: deploy/docker/minio/Dockerfile
      args:
        GO_VERSION: "1.24.8"
        MINIO_VERSION: "RELEASE.2025-10-15T17-29-55Z"
        HTTP_PROXY: "${CAIRN_BUILD_HTTP_PROXY:-}"
        HTTPS_PROXY: "${CAIRN_BUILD_HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
        CAIRN_BUILD_CA_CERT_BASE64: "${CAIRN_BUILD_CA_CERT_BASE64:-}"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${CAIRN_MINIO_PORT:-9000}:9000"
      - "${CAIRN_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${CAIRN_OBJECT_STORE_ACCESS_KEY:-cairn-local}"
      MINIO_ROOT_PASSWORD: "${CAIRN_OBJECT_STORE_SECRET_KEY:-cairn-local-only-change-before-deploying}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${CORS_ORIGINS:-http://localhost:5500}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - cairn_minio_data:/data

volumes:
  cairn_postgres_data:
  cairn_minio_data:
